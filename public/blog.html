<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Detail</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f7f7f7;
        color: #333;
        margin: 0;
      }

      .back-btn {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        margin-bottom: 20px;
      }

      .back-btn:hover {
        background-color: #45a049;
      }

      .blog-detail {
        background-color: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        margin: auto;
      }

      .blog-detail img {
        width: 100%;
        height: auto;
        border-radius: 10px;
        margin-bottom: 15px;
      }

      .blog-detail h2 {
        margin-top: 0;
        font-size: 28px;
      }

      .blog-detail p {
        line-height: 1.6;
        font-size: 16px;
      }

      .blog-detail p b {
        color: #555;
      }

      .button-btn {
        margin-top: 10px;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>

  <body>
    <button class="back-btn" onclick="window.location.href='/'"> Home</button>
    <div class="blog-detail" id="blogDetail">

    </div>
    <div class="button-btn">
      <button class="back-btn" onclick="window.location.href='/'"> Home</button>
    </div>

    <script>
      function formatDateTime(blog_date) {
        const date = new Date(blog_date);

        const options = {
          year: 'numeric',
          month: 'short',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: true
        };

        return date.toLocaleString('en-IN', options);
      }

      const blog = JSON.parse(localStorage.getItem('currentBlog'));
      const div = document.getElementById('blogDetail');
      div.innerHTML = `
      <img src="${blog.cover_img_path}" alt="">
      <h2>${blog.title}</h2>
      <p><b>Author:</b> ${blog.author} | ${formatDateTime(blog.createdAt)}</p>
      <p>${blog.content}</p>
    `;
    </script>
  </body>

</html>
