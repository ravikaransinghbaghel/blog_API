<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sorry Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      text-align: center;
    }
    h1 {
      font-size: 5rem;
      color: #ff4d4d;
    }
    p {
      font-size: 1.5rem;
      color: #555;
    }
    a {
      text-decoration: none;
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 20px;
      transition: 0.3s;
    }
    a:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>😞 Sorry!</h1>
    <p>You are not allowed to access this page.</p>
    <a href=`${process.env.FRONTEND_URL}`>Go Back Home</a>
  </div>
</body>
</html>
