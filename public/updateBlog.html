<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update Blog</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            .update-form-container {
                max-width: 600px;
                margin: 50px auto;
                background: white;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }

            .update-form-container h2 {
                text-align: center;
                margin-bottom: 20px;
            }

            .update-form-container label {
                display: block;
                margin: 15px 0 5px;
                font-weight: bold;
            }

            .update-form-container input,
            .update-form-container textarea {
                width: 100%;
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #ccc;
                resize: vertical;
            }

            .update-form-container input[type="file"] {
                padding: 5px;
            }

            .update-form-container button {
                width: 100%;
                margin-top: 20px;
                background-color: #007bff;
                color: white;
                padding: 12px;
                font-size: 16px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            }

            .update-form-container button:hover {
                background-color: #0056b3;
            }

            @media (max-width: 600px) {
                .update-form-container {
                    margin: 20px;
                    padding: 20px;
                }
            }
        </style>
    </head>

    <body>
        <button class="back-btn" onclick="window.location.href='index.html'">← Home</button>

        <div class="update-form-container">
            <h2>Update Blog</h2>
            <form id="updateForm">
                <input type="hidden" id="blogId" />

                <label for="title">Title</label>
                <input type="text" id="title" name="title" required />

                <label for="author">Author</label>
                <input type="text" id="author" name="author" required />

                <label for="content">Content</label>
                <textarea id="content" name="content" rows="6" required></textarea>

                <!-- <label for="coverImage">Cover Image</label>
                <input type="file" id="cover_img" name="cover_img" /> -->

                <button type="submit">Update Blog</button>
            </form>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const blog = JSON.parse(localStorage.getItem('currentBlog'));
                if (!blog) return alert('No blog data found.');

                document.getElementById('blogId').value = blog._id;
                document.getElementById('title').value = blog.title;
                document.getElementById('author').value = blog.author;
                document.getElementById('content').value = blog.content;
            });

            document.getElementById('updateForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('blogId').value;
                
                const form = e.target;
                // const formData = new FormData(form);
                const data = {
                    title: form.title.value,
                    author: form.author.value,
                    content: form.content.value,
                }

                try {
                    const res = await fetch(`/api/update/${id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data),
                        credentials: 'include'
                    });

                    const result = await res.json();
                    alert(result.message || 'Blog updated!');
                    window.location.href = 'index.html';
                } catch (err) {
                    console.error('Update failed', err);
                    alert('Failed to update blog.');
                }
            });
        </script>
    </body>

</html>
